<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #050505;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    .redirect-text {
      font-size: 1rem;
      letter-spacing: 3px;
      margin-bottom: 14px;
      color: #9d9d9d;
      text-transform: uppercase;
    }

    .timer {
      color: #00ffee;
      font-weight: bold;
    }

    h1 {
      color: #00ffee;
      font-size: 6rem;
      text-shadow:
        0 0 5px #00ffee,
        0 0 10px #00ffee,
        0 0 20px #00ffee,
        0 0 40px #00ffee;
      animation: glow 1s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow:
          0 0 5px #00ffee,
          0 0 10px #00ffee,
          0 0 20px #00ffee;
      }

      to {
        text-shadow:
          0 0 10px #00ffee,
          0 0 20px #00ffee,
          0 0 40px #00ffee,
          0 0 80px #00ffee;
      }
    }
  </style>
</head>
<body>

  <div class="redirect-text">
    YOU WILL BE REDIRECTED IN
    <span class="timer" id="countdown">1.255</span>
  </div>

  <h1>Hello!</h1>

  <script>
    const redirectTime = 1.255;
    const countdown = document.getElementById("countdown");

    let remaining = redirectTime;
    const start = Date.now();

    const interval = setInterval(() => {
      const elapsed = (Date.now() - start) / 1000;
      remaining = Math.max(0, redirectTime - elapsed);

      countdown.textContent = remaining.toFixed(3);

      if (remaining <= 0) {
        clearInterval(interval);
        window.location.href = "https://www.syscore.uk";
      }
    }, 10);
  </script>

</body>
</html>
