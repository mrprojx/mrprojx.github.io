<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>

  <!-- Redirect after 0.9 seconds -->
  <meta http-equiv="refresh" content="0.9;url=https://www.syscore.uk">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050505;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: #00ffee;
      font-size: 6rem;
      text-shadow:
        0 0 5px #00ffee,
        0 0 10px #00ffee,
        0 0 20px #00ffee,
        0 0 40px #00ffee;
      animation: glow 1s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow:
          0 0 5px #00ffee,
          0 0 10px #00ffee,
          0 0 20px #00ffee;
      }

      to {
        text-shadow:
          0 0 10px #00ffee,
          0 0 20px #00ffee,
          0 0 40px #00ffee,
          0 0 80px #00ffee;
      }
    }
  </style>
</head>
<body>

  <h1>Hello!</h1>

  <script>
    setTimeout(() => {
      window.location.href = "https://www.syscore.uk";
    }, 900);
  </script>

</body>
</html>
